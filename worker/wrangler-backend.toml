name = "ktb-backend"
main = "worker/backend.js"
compatibility_date = "2024-09-23"

# KV 命名空间（存账号与会员状态）。先 `wrangler kv namespace create KTB_DATA` 拿到 id 填入。
[[kv_namespaces]]
binding = "KTB_DATA"
id = "REPLACE_WITH_KV_ID"

[vars]
# 允许调用的前端来源（GitHub Pages 域名），多个用逗号分隔
CORS_ORIGIN = "https://kyriehao-beep.github.io"
# 试用天数
TRIAL_DAYS = "3"
# 站长账号（可多个，逗号分隔；与 ADMIN_PASS 顺序对应）
ADMIN_USER = "admin"

# 以下敏感项请务必用 secret 注入，不要写进文件：
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_PASS
# 例：wrangler secret put ADMIN_PASS   （输入与 ADMIN_USER 对应的密码，多个用逗号：pw1,pw2）
